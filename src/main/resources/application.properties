spring.application.name=school
server.port=8080

# 数据源配置（MySQL）
spring.datasource.url=jdbc:mysql://localhost:3306/school?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 打印 SQL 到控制台（最简单直接，推荐开发时使用）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Springdoc OpenAPI 相关配置（可选）

# Swagger UI 访问路径（默认是 /swagger-ui/index.html，一般无需修改）http://localhost:8080/swagger-ui/index.html
# 如果你想改成 /swagger，可以设置如下：
springdoc.swagger-ui.path=/swagger
# http://localhost:8080/swagger

# OpenAPI JSON 文档路径（默认是 /v3/api-docs，一般无需修改）http://localhost:8080/v3/api-docs
# springdoc.api-docs.path=/openapi.json
# http://localhost:8080/oepnapi.json

# UI 界面优化配置
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.show-request-duration=true
springdoc.swagger-ui.doc-expansion=none